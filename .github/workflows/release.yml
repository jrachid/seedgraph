name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Write the notes from the commits since the previous tag
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^")
          {
            git log --no-merges --format='- %s' "$previous..$GITHUB_REF_NAME"
            echo
            echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
          } > notes.md
      - run: gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
