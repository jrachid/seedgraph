[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seedgraph"
version = "0.1.5"
description = "Seed your SQLAlchemy models as a referentially-consistent graph — one call, shared parents, verified links."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Rachid Jeffali" }]
keywords = ["sqlalchemy", "seed", "fixtures", "testing", "orm", "foreign-keys", "test-data", "factory", "faker", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Pytest",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["sqlalchemy>=2.0", "faker>=30"]

[project.urls]
Homepage = "https://github.com/jrachid/seedgraph"
Documentation = "https://jrachid.github.io/seedgraph/"
Repository = "https://github.com/jrachid/seedgraph"
Issues = "https://github.com/jrachid/seedgraph/issues"

[project.optional-dependencies]
async = ["sqlalchemy[asyncio]>=2.0", "aiosqlite>=0.17"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "aiosqlite>=0.17",
    "pytest-asyncio>=0.23",
    "greenlet>=3.0",
    "testcontainers[postgres]>=4.0",
    "psycopg[binary]>=3.1",
    "asyncpg>=0.29",
    "mypy>=1.11",
    "polyfactory>=3.3.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings-python>=2.0.9",
    "mkdocs-llmstxt>=0.5.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mkdocs>=1.6,<2",
]

[project.entry-points.pytest11]
seedgraph = "seedgraph.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/seedgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["postgres: needs Docker to start a disposable PostgreSQL"]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.mypy]
files = ["src"]
strict = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"ci/**" = ["ANN"]
